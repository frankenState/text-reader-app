<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Local Voice</title>
<style>
  :root {
    --bg: #f6f3ed;
    --ink: #191713;
    --muted: #6b6558;
    --line: rgba(25, 23, 19, 0.13);
    --accent: #a03f1f;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 380px;
    padding: 0 32px;
    text-align: center;
  }

  .mark {
    width: 40px;
    height: 40px;
    color: var(--ink);
    margin-bottom: 24px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  p {
    margin: 0;
    font-size: 14px;
    color: var(--muted);
  }

  .rule {
    position: relative;
    height: 2px;
    margin: 28px auto 0;
    width: 132px;
    border-radius: 1px;
    background: var(--line);
    overflow: hidden;
  }

  .rule::after {
    content: "";
    position: absolute;
    inset: 0;
    width: 40%;
    border-radius: 1px;
    background: var(--accent);
    animation: travel 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }

  @keyframes travel {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .rule::after { animation: none; width: 100%; }
  }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M4 10.5v3M8.5 7v10M13 4.5v15M17.5 8v8M21 10.5v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  </svg>
  <h1>Warming up the voice</h1>
  <p id="msg">Loading the model into memory. The first start takes a few seconds.</p>
  <div class="rule" aria-hidden="true"></div>
</main>
</body>
</html>
